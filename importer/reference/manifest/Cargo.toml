[package]
name = "rawr-manifest-reference"
version = "0.0.0"
edition = "2024"
publish = false

# prepare.py materializes the verified upstream tree next to this package.
# This isolated workspace is never a product dependency.
[workspace]
resolver = "2"
exclude = ["cargo/crates/cargo-util-schemas"]

[dependencies]
cargo-util-schemas = { path = "cargo/crates/cargo-util-schemas" }
serde_ignored = "=0.1.14"
serde_json = "=1.0.150"
semver = "=1.0.28"
url = "=2.5.8"
toml = { version = "=1.1.2", default-features = false, features = ["std", "serde", "parse", "display", "preserve_order"] }
# Exact active interpreter pins; full +spec versions/checksums are checked by prepare.py.
toml_parser = { version = "=1.1.2", default-features = false, features = ["std", "alloc"] }
toml_datetime = { version = "=1.1.1", default-features = false, features = ["std", "alloc", "serde"] }
serde_spanned = { version = "=1.1.1", default-features = false, features = ["std", "alloc", "serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_core = "=1.0.228"
serde_derive = "=1.0.228"
serde-untagged = "=0.1.9"
serde-value = "=0.7.0"
jiff = { version = "=0.2.31", default-features = false, features = ["std", "serde"] }
thiserror = "=2.0.18"
unicode-ident = "=1.0.24"
indexmap = "=2.14.0"
hashbrown = { version = "=0.17.1", default-features = false }
equivalent = "=1.0.2"
toml_writer = { version = "=1.1.1", default-features = false, features = ["std", "alloc"] }
winnow = "=1.0.3"
