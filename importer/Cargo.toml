[package]
name = "rawr-import"
version = "0.1.0"
rust-version = "1.91.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[features]
canonical-selector-diagnostic = []
default = []
rustc-driver = []
# Private launch evidence for the canonical import baseline only.
import-baseline = ["rustc-driver", "test-fixtures"]
test-fixtures = []
# Embed the Rawr source tree a generated harness builds against, so an
# installed `rawr` never reads a development checkout.
embedded-host = []

[[bin]]
name = "rawr-import-driver"
path = "src/driver.rs"
required-features = ["rustc-driver"]

[dependencies]
anstream = { version = "=1.0.0", default-features = false }
fd-lock = "4"
icu_collections = { version = "=2.2.0", default-features = false }
icu_normalizer = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
idna_adapter = { version = "=1.2.2", default-features = false, features = ["compiled_data"] }
memchr = { version = "=2.8.2", default-features = false, features = ["std"] }
rawr-directory = { path = "../directory" }
rawr-canonical = { path = "../canonical" }
nix = { version = "0.27.1", features = ["fs", "poll", "process", "signal", "socket", "time", "user"] }
rustix = { version = "=1.1.4", features = ["fs", "termios"] }
rawr-toml = { path = "../toml" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.10", features = ["asm"] }
thiserror = "2"
toml_edit = "0.25.13"
unicode-ident = "=1.0.24"
utf8_iter = "=1.0.4"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
form_urlencoded = "=1.2.2"
idna = { version = "=1.1.0", default-features = false, features = ["std", "compiled_data"] }
percent-encoding = "=2.3.2"
smallvec = { version = "=1.15.2", features = ["const_generics"] }
url = "=2.5.8"
