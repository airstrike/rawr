[package]
name = "rawr-import"
version = "0.3.8"
rust-version = "1.91.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[features]
canonical-selector-diagnostic = []
default = []
rustc-driver = ["unicode-hosts", "unicode-names"]
# UTS46 processing of non-ASCII and uppercase host names in manifest URLs.
# Every command that reads manifests has it; a project's runner does not.
unicode-hosts = ["dep:icu_collections", "dep:icu_normalizer", "dep:idna_adapter"]
# Unicode identifier classes for package, target and feature names (`xid`).
# Every command that reads manifests has it; a project's runner does not.
unicode-names = ["dep:unicode-ident"]
test-fixtures = ["unicode-hosts", "unicode-names"]
# Embed the Rawr source tree a generated harness builds against, so an
# installed `rawr` never reads a development checkout.
embedded-host = []

[[bin]]
name = "rawr-import-driver"
path = "src/driver.rs"
required-features = ["rustc-driver"]

[dependencies]
anstream = { version = "1.0.0", default-features = false }
fd-lock = "4"
# Unicode host names in manifest URLs (`unicode-hosts`). Their derive macros
# ask syn for `extra-traits`, `fold` and `visit`, which a project's runner
# must not: it would build a second syn, and every proc macro iced uses.
icu_collections = { version = "2.2.0", default-features = false, optional = true }
icu_normalizer = { version = "2.2.0", default-features = false, features = ["compiled_data"], optional = true }
idna_adapter = { version = "1.2.2", default-features = false, features = ["compiled_data"], optional = true }
memchr = { version = "2.8.2", default-features = false, features = ["std"] }
rawr-directory = { path = "../directory" }
rawr-location = { path = "../location" }
rawr-canonical = { path = "../canonical" }
# No nix: every nix version asks libc for `extra_traits`, which would make a
# project's runner build a second libc, and with it a second iced.
libc = "0.2"
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "termios", "time"] }
rawr-toml = { path = "../toml" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.10", features = ["asm"] }
thiserror = "2"
toml_edit = { package = "rawr-toml-edit", path = "../toml/edit" }
# Optional (`unicode-names`): a project's proc macros build `unicode-ident` as a
# host unit, and without `--target` the runner's own copy would replace it.
unicode-ident = { version = "1.0.24", optional = true }
utf8_iter = "1.0.4"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
nix = { version = "0.27.1", features = ["fs", "poll", "process", "signal", "socket", "time", "user"] }
form_urlencoded = "=1.2.2"
idna = { version = "=1.1.0", default-features = false, features = ["std", "compiled_data"] }
percent-encoding = "=2.3.2"
smallvec = { version = "=1.15.2", features = ["const_generics"] }
url = "=2.5.8"
