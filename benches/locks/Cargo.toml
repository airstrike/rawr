[package]
name = "rawr-lock-bench"
version = "0.1.0"
edition = "2024"
publish = false
autobenches = false
build = "build.rs"

# The lock sites' workloads (benches/README.md, "Lock workloads"). A
# package of its own, so its build script, which embeds the revision it
# measures, runs for this bench alone and never in rawr's own builds.
[[bench]]
name = "locks"
path = "main.rs"
harness = false

[features]
# Counts by default. A timed run builds without it: no counted sites and
# no counting allocator.
default = ["counters"]
counters = ["rawr/lock-counters"]

[dependencies]
rawr = { path = "../..", features = ["sync", "rust-import"] }
rawr_import = { package = "rawr-import", path = "../../importer", features = ["test-fixtures"] }
serde_json = "1.0.45"
sha2 = "0.10.9"
