[package]
name = "rawr-gui"
version = "0.4.25"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "The debugger window `rawr gui` opens: an iced shell on a run's debugger session"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[dependencies]
iced = { version = "0.14.0", features = ["highlighter", "image"] }
serde_json = "1.0.45"

[dev-dependencies]
iced_runtime = "0.14.0"
iced_test = "0.14.0"
