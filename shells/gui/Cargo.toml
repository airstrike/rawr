[package]
name = "rawr-gui"
version = "0.4.91"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "The debugger window `rawr gui` opens: an iced shell on a run's debugger session"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[dependencies]
iced = { workspace = true, features = ["highlighter", "image"] }
iced_split = { workspace = true }
serde_json = "1.0.45"

[build-dependencies]
# The toolbar's icons: a Lucide font of only the icons fonts/icons.toml
# names, and a function for each.
iced_lucide = { git = "https://github.com/airstrike/iced_lucide" }

[dev-dependencies]
iced_runtime = { workspace = true }
iced_test = { workspace = true }
