[package]
name = "rawr-tui"
version = "0.4.102"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "A terminal debugger shell on a rawr run's shared debugger session"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm.workspace = true
ratatui.workspace = true
serde_json = "1.0.45"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[dev-dependencies]
ab_glyph = "0.2"
png = "0.18"
