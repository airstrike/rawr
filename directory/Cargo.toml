[package]
name = "rawr-directory"
version = "0.3.213"
rust-version = "1.91.0"
edition = "2024"
publish = false

[dependencies]
# No floor past what the code uses: rawr resolves its crates with a
# project's, and a higher one would raise the libc the project pins (#1912).
libc = "0.2"
thiserror = "2"
