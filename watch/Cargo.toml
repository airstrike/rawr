[package]
name = "rawr-watch"
version = "0.5.9"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "Exact filesystem-event transport for Rawr reload hosts"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[features]
# Disable native callback delivery only in explicitly selected deterministic tests.
manual = []

[dependencies]
notify = { package = "rawr-notify", path = "notify" }
rawr = { path = ".." }

# Waiting for a child's end without reaping it (`exit::wait`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
rawr = { path = "..", features = ["rust-import"] }
rawr_import = { package = "rawr-import", path = "../importer" }
