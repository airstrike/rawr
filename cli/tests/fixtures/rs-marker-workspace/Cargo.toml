# A Cargo workspace whose app crate is marked. Its members inherit their
# dependencies and edition from here.
[workspace]
members = ["app", "dice"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
dice = { path = "dice" }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
