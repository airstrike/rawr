[package]
name = "rawr-cli"
version = "0.1.0"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "The rawr command: runs Rawr programs and hands those using iced to rawr-iced"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[dependencies]
rawr = { path = "..", features = ["sync"] }
rawr-location = { path = "../location" }
serde_json = "1.0.45"
toml_edit = { package = "rawr-toml-edit", path = "../toml/edit", default-features = false, features = ["parse", "display"] }

[[bin]]
name = "rawr"
path = "src/main.rs"

[[bin]]
name = "cargo-rawr"
path = "src/cargo_rawr.rs"
