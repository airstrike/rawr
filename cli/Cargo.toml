[package]
name = "rawr-cli"
version = "0.3.25"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "The rawr command: runs Rawr programs and hands a program to the installed extension that serves it"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[dependencies]
rawr = { path = "..", features = ["sync"] }
rawr-location = { path = "../location" }
rawr-watch = { path = "../watch" }
serde_json = "1.0.45"
toml_edit = { package = "rawr-toml-edit", path = "../toml/edit", default-features = false, features = ["parse", "display"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27.1", features = ["process", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[[bin]]
name = "rawr"
path = "src/main.rs"

[[bin]]
name = "cargo-rawr"
path = "src/cargo_rawr.rs"
