# The binaries `rawr` hands programs to, so it can say how to install one
# that is missing. Each entry is the manifest the binary prints for
# `--rawr-manifest`, plus the commands that install it. `rawr` reads them
# as data and names no binary itself.

# The installer puts rawr-import beside rawr with the rest of rawr's prebuilt
# binaries. rawr-import installs the pinned nightly it reads crate APIs with
# the first time it needs it.
[[binary]]
format = 1
name = "rawr-import"
sections = ["rust"]
commands = ["cache"]
install = [
    "curl -LsSf https://rawr.airstrike.fyi/install.sh | sh",
]
