# toml_edit 0.25.17 from crates.io, without its serde, visit and visit_mut
# modules (Rawr uses none), and with one change: its tables name the
# hasher (std's RandomState) instead of asking indexmap for its
# `std` feature. A project's runner links this crate beside iced, whose wgpu and
# naga use indexmap without `std`; any feature added there would make a
# second copy of them, and with them of iced.
[package]
name = "rawr-toml-edit"
version = "0.25.17"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"
description = "toml_edit, with tables that name their hasher"

[lib]
name = "toml_edit"
path = "src/lib.rs"

[features]
debug = [
    "toml_parser?/debug",
    "dep:anstream",
    "dep:anstyle",
    "display",
]
default = [
    "parse",
    "display",
]
display = ["dep:toml_writer"]
parse = [
    "dep:toml_parser",
    "dep:winnow",
]
unbounded = []

[dependencies.anstream]
version = "1.0.0"
optional = true

[dependencies.anstyle]
version = "1.0.14"
optional = true

[dependencies.indexmap]
version = "2.13.0"
default-features = false

[dependencies.toml_datetime]
version = "1.1.2"

[dependencies.toml_parser]
version = "1.1.5"
optional = true

[dependencies.toml_writer]
version = "1.1.3"
optional = true

[dependencies.winnow]
version = "1.0.0"
optional = true

