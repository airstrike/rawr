[package]
name = "rawr-toml"
version = "0.3.26"
rust-version = "1.91.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Private bounded Cargo manifest document foundation"

[dependencies]
thiserror = "2"
toml_datetime = { version = "1.1.1", default-features = false, features = ["std"] }
winnow = { version = "1.0.4", default-features = false }

[dev-dependencies]
serde_json = "1"
