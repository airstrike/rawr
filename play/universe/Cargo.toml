# ?play's universe (#434, #436): the crates a snippet can use, and the
# program whose native calls the prebuilt runner covers. `rawr-import`
# builds its runner once, when the image is built, with
# RAWR_UNIVERSE_RUNNER=1, and the bot runs each snippet on that runner with
# no Cargo (play/README.md).
[package]
name = "play"
version = "0.1.0"
edition = "2024"
publish = false

# The native universe, ?play's server's, whose iced has no window.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# tokio is iced's executor, as iced's stopwatch and clock enable it: it
# gives them `time::every` (#889). canvas is the examples' that draw
# (#1000).
iced = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b", features = ["canvas", "tokio"] }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
# The landing page's ratatui snippet (programs/ui.rs), at the version the
# repository's examples/tui uses.
ratatui = "0.30"

# The browser's universe (#1395), which web.sh builds for wasm32: iced on
# its own web shell, drawing with WebGPU or WebGL2 (tiny-skia when the page
# has neither) and its embedded font, tokio on the page's one thread, and
# ratatui without a terminal backend of its own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b", default-features = false, features = ["canvas", "wgpu", "tiny-skia", "webgl", "fira-sans", "crisp", "web-colors"] }
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
ratatui = { version = "0.30", default-features = false }

# Its own workspace: it is not a member of Rawr's.
[workspace]

# iced's shell has no window here (#434): iced's `run` hands the program to
# ?play's shell, which runs it headless until it settles and writes its
# frame as a PNG, or a GIF when it animated (shell/src/lib.rs).
[patch."https://github.com/iced-rs/iced"]
iced_winit = { path = "shell" }

# No debug info: on Linux it is linked into the runner, which then passes
# the 256 MiB a runner's executable may have. The image has no debugger.
[profile.dev]
debug = false

# A GIF's frames are quantized as they are drawn, within the snippet's time.
[profile.dev.package.color_quant]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3
