[package]
name = "rawr-play"
version = "0.3.177"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "Run untrusted Rawr snippets for a Discord `?play` bot: plain programs return their output"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[features]
## Build the `rawr-play-bot` Discord binary.
bot = ["dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:reqwest", "dep:serenity", "dep:tokio"]

[dependencies]
# Server tokens in reports: one AES-256 block per guild ID (see src/server.rs).
aes = "0.8"
rawr = { path = "..", features = ["sync"] }
# How a snippet becomes a program, shared with rawr-web.
rawr-snippet = { path = "snippet" }
# Already in the bot through serenity; plain HTTP to the channel config store.
reqwest = { version = "0.12", default-features = false, optional = true }
# A program's output, as JSON, with the frame an iced program drew in base64.
base64 = "0.22"
serde_json = "1"
# The playground render port (already in the bot through reqwest).
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
serenity = { version = "0.12.5", default-features = false, features = ["cache", "client", "gateway", "model", "native_tls_backend"], optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "rawr_play"
path = "src/lib.rs"

[[bin]]
name = "rawr-play"
path = "src/bin/rawr-play.rs"

[[bin]]
name = "rawr-play-bot"
path = "src/bin/rawr-play-bot.rs"
required-features = ["bot"]

[dev-dependencies]
# The universe tests read the frames of an animated program's GIF.
gif = "0.14"
