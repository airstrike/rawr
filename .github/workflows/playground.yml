# rawr-web, the playground's "Run in browser" module, and the browser's
# universe, built for wasm32 by web/build.sh, kept as this run's `web`
# artifact, and published to R2 as one set (upload-web.mjs), which the
# Worker serves under /web from the next page load. It deploys nothing and
# never asks the bot: a new set goes live by its pointer alone.
#
# It runs by hand (Run workflow), nightly from bot.yml, and as stage 2 of
# release.yml. Runs take the group `web-modules` one at a time, in order,
# and upload-web.mjs never points the site at a set built from an older
# commit than the one it runs.
#
# The target dir (with wasm-bindgen-cli at the Cargo.lock version) and the
# cargo registry live in the Actions cache. Its key is the external
# dependencies of Cargo.lock (scripts/deps-key.sh), which a version bump
# does not move, so the cache is saved once per dependency change and a run
# recompiles the workspace's crates and the LTO link only: about 3 minutes.
#
# It needs the CLOUDFLARE_API_TOKEN secret (with R2 write on the bucket) and
# the CLOUDFLARE_ACCOUNT_ID variable ("Release from GitHub Actions" in
# play/README.md).
name: Playground

on:
  workflow_dispatch:
  workflow_call:

# Its own group, apart from the Worker's deploys (site.yml's `worker-deploy`):
# a module build never holds up a deploy, nor a deploy a build.
concurrency:
  group: web-modules
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  web:
    runs-on: ubuntu-latest
    # web/build.sh builds the browser universe twice: plain, and with the
    # debugger the playground swaps in (D1071).
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5

      # The runner's Rust can trail the workspace's rust-version.
      - name: Install stable Rust for wasm32
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default stable

      - name: Key the cache
        id: key
        run: echo "deps=$(scripts/deps-key.sh)" >> "$GITHUB_OUTPUT"

      # Keyed by commit and restored from the newest earlier save, so each run
      # starts from the last one's build and recompiles only what changed:
      # rawr-import and its driver in target/release, and both universes in
      # target/wasm. A key that never changed would restore one stale build
      # and recompile all of rawr's own crates every run.
      - name: Restore the builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/wasm
          key: web-${{ steps.key.outputs.deps }}-${{ github.sha }}
          restore-keys: |
            web-${{ steps.key.outputs.deps }}-
            web-

      # The browser's universe (#1395) is built by rawr-import, which reads
      # the universe with its driver on the extraction nightly, as the bot
      # image's universe stage does (play/Dockerfile).
      - name: Install the extraction nightly
        run: rustup toolchain install nightly-2026-07-11 --profile minimal --component rustc-dev,rust-src --target wasm32-unknown-unknown --no-self-update

      - name: Build rawr-import and its driver
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo build --release --locked -p rawr-import-cli --bin rawr-import
          cargo +nightly-2026-07-11 build --release --locked -p rawr-import --features rustc-driver --bin rawr-import-driver

      - name: Build rawr-web
        env:
          RAWR_IMPORT: ${{ github.workspace }}/target/release/rawr-import
        run: time web/build.sh target/web

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: target/web
          retention-days: 7

  # The set goes to R2, its pointer last (upload-web.mjs), and the site runs
  # it from the next page load: no Worker deploy, and no wait on the bot. A
  # job of its own, so a failed upload is re-run without the build.
  publish:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: play/deploy/cloudflare
    steps:
      - uses: actions/checkout@v5
        with:
          # upload-web.mjs compares this commit with the pointer's by ancestry.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The lock file is not committed yet, so this is `npm install`, not `npm ci`.
      - name: Install the Worker's dependencies
        run: npm install --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: target/web

      - name: Publish the set to R2
        env:
          COMMIT: ${{ github.sha }}
        run: node upload-web.mjs "$GITHUB_WORKSPACE/target/web" --commit "$COMMIT"
