# The one deploy of the Worker and site: deploy main's latest commit, then
# check it. deploy.sh builds the site, runs the Worker's and the site's
# tests, deploys (`wrangler deploy`) and, when the deploy rolls out a new
# ?play image, waits for Cloudflare and then the bot to report it.
#
# What it deploys:
# - main's head, read when this run's turn comes: a queued run that starts
#   later deploys newer code, never its trigger's older commit;
# - the image: `image` when bot.yml dispatched a rollout of the one it just
#   pushed, unless Cloudflare already runs a newer one; else the one
#   Cloudflare runs now. Read inside the concurrency group, so a rollout
#   that ran just before is never rolled back.
# rawr-web's modules are not in the deploy: the Worker serves them from R2
# (src/web.ts), and the Playground workflow publishes them there. The site's
# build still runs the docs' snippets in rawr-web, so it fetches the set the
# site runs from R2 (live-web.sh --r2) into target/web, and deploys none of it.
#
# Triggers:
# - a push to main that changes plan/, site/ or the Worker
#   (play/deploy/cloudflare): /todo, the changelog, the docs, and Worker
#   code or settings (wrangler.jsonc's vars, such as PLAY_TIME_MS) go live in
#   minutes with the running image. A settings change restarts the bot on its
#   image (src/index.ts compares them);
# - by hand (Run workflow), and from bot.yml after it pushes an image
#   (`gh workflow run`, with `image`).
# It needs the CLOUDFLARE_API_TOKEN secret and the
# CLOUDFLARE_ACCOUNT_ID variable ("Release from GitHub Actions" in
# play/README.md). The job's copy of wrangler.jsonc is rewritten, never pushed.
name: Deploy the site

on:
  workflow_dispatch:
    inputs:
      image:
        description: The ?play image to roll out (registry.cloudflare.com/…/rawr-play:<commit>); empty keeps the running one.
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "plan/**"
      - "site/**"
      - "play/deploy/cloudflare/**"
      - ".github/workflows/site.yml"

# Every Worker deploy is a run of this workflow, in this one group. One runs
# at a time, and `queue: max` keeps every waiting run in order, so a queued
# run (a rollout's among them) is never cancelled.
concurrency:
  group: worker-deploy
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  # main's head, read on this run's turn, inside the group. A run with no
  # image to roll out and a newer run of this workflow waiting behind it
  # has nothing of its own: that run deploys main's head too, so a burst of
  # pushes deploys once.
  head:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      deploy: ${{ steps.head.outputs.deploy }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
        run: |
          sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          echo "main is at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          waiting=$(gh run list -R "$GITHUB_REPOSITORY" --workflow site.yml --limit 50 --json databaseId,status \
            --jq "[.[] | select(.databaseId > $GITHUB_RUN_ID and .status != \"completed\")] | length")
          if [ -z "$IMAGE" ] && [ "$waiting" -gt 0 ]; then
            echo "::notice::a newer run waits behind this one and deploys main's head"
            echo deploy=false >> "$GITHUB_OUTPUT"
          else
            echo deploy=true >> "$GITHUB_OUTPUT"
          fi

  site:
    needs: head
    if: needs.head.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: play/deploy/cloudflare
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.head.outputs.sha }}
          # The image step compares commits by ancestry.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install the site's dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      # The lock file is not committed yet, so this is `npm install`, not `npm ci`.
      - name: Install the Worker's dependencies
        run: npm install --no-audit --no-fund

      # The job's own copy of wrangler.jsonc names the image and its tag as
      # PLAY_VERSION, which tells the bot to restart when it changed. An
      # image older than the running one (an ancestor of its commit) keeps
      # the running one.
      - name: Point wrangler.jsonc at the image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          running="$(./pin-image.sh --running)"
          echo "Cloudflare runs $running"
          if [ -n "$IMAGE" ] && [ "${IMAGE##*:}" != "${running##*:}" ] &&
            git merge-base --is-ancestor "${IMAGE##*:}" "${running##*:}" 2>/dev/null; then
            echo "::notice::$IMAGE is older than the running image; the deploy keeps $running"
            IMAGE=""
          fi
          if [ -n "$IMAGE" ]; then tag="$(./pin-image.sh "$IMAGE")"; else tag="$(./pin-image.sh "$running")"; fi
          echo "deploying rawr-play:$tag"

      - name: Fetch rawr-web for the site's build
        run: ./live-web.sh --r2

      - name: Test, deploy and check the site
        run: ./deploy.sh

      - name: Show the logs
        if: failure()
        working-directory: .
        run: |
          for log in target/logs/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
