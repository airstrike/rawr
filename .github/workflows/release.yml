# Release rawr to the web in stages, each one a reusable workflow that also
# runs on its own. Each stage starts only after the one before it succeeded
# (or was skipped), and a failure stops every stage after it.
#
#   1. binaries (binaries.yml): the GitHub release's prebuilt archives. Off
#      unless the `binaries` input is ticked: patch releases have no tags of
#      their own yet. It does nothing when the version already has archives.
#   2. playground (playground.yml): rawr-web, built into this run's `web`
#      artifact. About 3 minutes with its cache.
#   3. bot (bot.yml): the ?play image, built and pushed only when its inputs
#      changed since the image Cloudflare runs (`bot: auto`), always
#      (`always`) or never (`skip`). Skipped, the deploy keeps the running
#      image. Built, about 10-15 minutes with its cache (see bot.yml).
#   4. site (site.yml): one deploy of the Worker and site with this run's
#      rawr-web and the new image (or the running one), then the wait for the
#      bot and the site's snippets against the server that has just gone
#      live. About 3 minutes, plus up to 5 for a new image's rollout.
#
# Stages 2 and 3 publish only (an artifact, a registry image); the site
# stage makes the one deploy, so the site never goes live ahead of its bot,
# and a failed stage leaves the live site as it was. A Worker settings or
# code change needs none of this: site.yml deploys it on its own on push.
#
# It needs the CLOUDFLARE_API_TOKEN and PLAY_SMOKE_TOKEN secrets and the
# CLOUDFLARE_ACCOUNT_ID variable (see "Release from GitHub Actions" in
# play/README.md).
name: Release

on:
  workflow_dispatch:
    inputs:
      binaries:
        description: Build the GitHub release's prebuilt archives first (binaries.yml).
        type: boolean
        default: false
      bot:
        description: "Build the ?play image: `auto` when its inputs changed, `always`, or `skip`."
        type: choice
        options: [auto, always, skip]
        default: auto

# One release or deploy at a time: every stage workflow run on its own takes
# this group too. `queue: max` keeps every waiting run in order, so a queued
# one never cancels another.
concurrency:
  group: release-play
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  binaries:
    if: inputs.binaries
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: write
    secrets: inherit

  playground:
    needs: binaries
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/playground.yml
    with:
      deploy: false
    secrets: inherit

  bot:
    needs: playground
    if: ${{ !failure() && !cancelled() && inputs.bot != 'skip' }}
    uses: ./.github/workflows/bot.yml
    with:
      build: ${{ inputs.bot }}
      deploy: false
    secrets: inherit

  site:
    needs: [playground, bot]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/site.yml
    with:
      image: ${{ needs.bot.outputs.image }}
      web: artifact
    secrets: inherit
