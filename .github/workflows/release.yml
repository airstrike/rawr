# Release rawr to the web in stages, each one a reusable workflow that also
# runs on its own. Each stage starts only after the one before it succeeded
# (or was skipped), and a failure stops every stage after it.
#
#   1. binaries (binaries.yml): the GitHub release's prebuilt archives. Off
#      unless the `binaries` input is ticked: patch releases have no tags of
#      their own yet. It does nothing when the version already has archives.
#   2. playground (playground.yml): rawr-web and the browser's universe,
#      built and published to R2, where the site runs them from the next
#      page load. No deploy.
#   3. bot (bot.yml): the ?play image, built and pushed only when its inputs
#      changed since the image Cloudflare runs (`bot: auto`), always
#      (`always`) or never (`skip`). Built, about 10-15 minutes with its
#      cache (see bot.yml), it dispatches site.yml to roll it out: one deploy
#      of main's latest commit with the new image, in its turn among the
#      Worker's deploys, then the wait for the bot to report it. Skipped,
#      nothing rolls out and nothing deploys.
#
# A Worker settings or code change needs none of this: site.yml deploys it
# on its own on push.
#
# It needs the CLOUDFLARE_API_TOKEN secret and the
# CLOUDFLARE_ACCOUNT_ID variable (see "Release from GitHub Actions" in
# play/README.md).
name: Release

on:
  workflow_dispatch:
    inputs:
      binaries:
        description: Build the GitHub release's prebuilt archives first (binaries.yml).
        type: boolean
        default: false
      bot:
        description: "Build the ?play image: `auto` when its inputs changed, `always`, or `skip`."
        type: choice
        options: [auto, always, skip]
        default: auto

# One release at a time. Its stages take their own workflows' groups too
# (`web-modules`, `bot-image`), and the rollout is a site.yml run in
# `worker-deploy`, the group of every Worker deploy.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  binaries:
    if: inputs.binaries
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: write
    secrets: inherit

  playground:
    needs: binaries
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/playground.yml
    secrets: inherit

  bot:
    needs: playground
    if: ${{ !failure() && !cancelled() && inputs.bot != 'skip' }}
    uses: ./.github/workflows/bot.yml
    # Its rollout job dispatches site.yml.
    permissions:
      contents: read
      actions: write
    with:
      build: ${{ inputs.bot }}
      deploy: true
    secrets: inherit
