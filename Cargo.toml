[workspace]
members = [
    ".",
    "canonical",
    "cli",
    "iced-cli",
    "import-cli",
    "codegen",
    "codegen/tests/custom_root",
    "directory",
    "examples/grep",
    "examples/invaders",
    "examples/islands",
    "examples/rules",
    "examples/tui",
    "iced",
    "play",
    "play/sandbox",
    "importer",
    "location",
    "toml",
    "toml/edit",
    "macros",
    "watch",
    "web",
]
resolver = "3"

# The example apps' dependencies, as iced's examples take theirs.
[workspace.dependencies]
crossterm = "0.29"
ratatui = "0.30"
rawr = { path = "." }
softbuffer = "0.4"
winit = "0.30"

[package]
name = "rawr"
version = "0.3.29"
rust-version = "1.95.0"
edition = "2024"
autobenches = false
authors = ["Andy Terra"]
description = "A Rust interpreter for your dev builds"
homepage = "https://github.com/airstrike/rawr"
repository = "https://github.com/airstrike/rawr"
readme = "README.md"
license = "MIT OR Apache-2.0"
include = ["/src/**/*", "/Cargo.toml", "/README.md", "LICENSE*"]
keywords = ["scripting", "scripting-language", "interpreter", "hot-reload"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
# A project's runner links this crate beside the project's own crates, and any
# feature added here makes a second smallvec, with every crate above it.
smallvec = { version = "1.7.0", default-features = false }
thin-vec = { version = "0.2.13", default-features = false }
ahash = { version = "0.8.4", default-features = false, features = ["std", "compile-time-rng"] }
num-traits = { version = "0.2.14", default-features = false, features = ["std"] }
# A project's runner links this crate beside the project's own crates, and any
# feature added here makes a second once_cell.
once_cell = { version = "1.20.1", default-features = false, features = ["std"] }
bitflags = { version = "2.3.3", default-features = false }
futures-core = { version = "0.3.31", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
smartstring = { version = "1.0.0", default-features = false, features = ["std"] }
rawr_codegen = { version = "0.3.29", path = "codegen" }
toml_edit = { package = "rawr-toml-edit", path = "toml/edit", default-features = false, features = ["parse", "display"] }
rawr_import = { package = "rawr-import", path = "importer", optional = true }
thiserror = { version = "2", optional = true }

serde = { version = "1.0.136", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1.0.45", default-features = false, features = ["alloc"] }
unicode-xid = { version = "0.2.0", default-features = false, optional = true }
rust_decimal = { version = "1.24.0", default-features = false, features = ["maths"], optional = true }
getrandom = { version = "0.3.4", optional = true }
rustyline = { version = "15.0.0", optional = true }
document-features = { version = "0.2.0", optional = true }
arbitrary = { version = "1.3.2", optional = true, features = ["derive"] }

[dev-dependencies]
rmp-serde = "1.1.1"
rawr_import = { package = "rawr-import", path = "importer", features = ["test-fixtures"] }

[features]

## Default features: uses runtime random numbers for hashing.
default = ["std", "ahash/runtime-rng"] # ahash/runtime-rng trumps ahash/compile-time-rng
## Always on. The name stays because generated runner manifests enable it.
## Without the default features, hashing uses a compile-time random number.
std = []
## Enable Rawr manifest transformation into a zero-touch Cargo importer request.
rust-import = ["dep:rawr_import", "dep:thiserror"]
## Build exact real-extraction integration tests with the pinned importer driver.
rust-import-driver-tests = ["rust-import", "rawr_import/rustc-driver"]
## Enable the pinned compiler metadata probe used by Phase 1 extraction.
rust-import-driver = ["rust-import", "rawr_import/rustc-driver"]

#! ### Enable Special Functionalities

## Require that all data types implement `Send + Sync` (for multi-threaded usage).
sync = ["rawr_codegen/sync"]
## Add support for the [`Decimal`](https://crates.io/crates/rust_decimal) data type.
decimal = ["rust_decimal"]
## Enable serialization/deserialization of Rawr data types via [`serde`](https://crates.io/crates/serde).
serde = ["dep:serde", "smartstring/serde", "smallvec/serde", "thin-vec/serde"]
## Allow [Unicode Standard Annex #31](https://unicode.org/reports/tr31/) for identifiers.
unicode-xid-ident = ["unicode-xid"]
## Enable functions metadata (including doc-comments); implies [`serde`](#feature-serde).
metadata = ["serde", "rawr_codegen/metadata", "smartstring/serde"]
## Expose internal data structures (e.g. `AST` nodes).
internals = []
## Enable the debugging interface (implies [`internals`](#feature-internals)).
debugging = ["internals"]
## Features and dependencies required by `bin` tools: `decimal`, `metadata`, `serde`, `debugging` and [`rustyline`](https://crates.io/crates/rustyline).
bin-features = ["decimal", "metadata", "serde", "debugging", "rustyline"]
## Enable fuzzing via the [`arbitrary`](https://crates.io/crates/arbitrary) crate.
fuzz = ["arbitrary", "rust_decimal?/rust-fuzz", "serde", "grain"]
## Enable the experimental `grain` bytecode VM
grain = []

#! ### JavaScript Interface for WASM

## Use [`wasm-bindgen`](https://crates.io/crates/wasm-bindgen) as JavaScript interface.
wasm-bindgen = ["getrandom/wasm_js"]

#! ### Features used in testing environments only

## Compiled with a non-stable compiler (i.e. beta or nightly)
unstable = []

## Running under a testing environment.
testing-environ = []

[[bin]]
name = "rawr-repl"
required-features = ["rustyline"]

[[bin]]
name = "rawr-run"

[[bin]]
name = "rawr-dbg"
required-features = ["debugging"]

# These inherited micro-benchmarks use the unstable libtest benchmark API.
# Keep them available on nightly without making stable all-target release
# verification attempt to compile `#![feature(test)]`.
[[bench]]
name = "engine"
required-features = ["unstable"]

[[bench]]
name = "eval_array"
required-features = ["unstable"]

[[bench]]
name = "eval_expression"
required-features = ["unstable"]

[[bench]]
name = "eval_map"
required-features = ["unstable"]

[[bench]]
name = "eval_module"
required-features = ["unstable"]

[[bench]]
name = "eval_scope"
required-features = ["unstable"]

[[bench]]
name = "eval_type"
required-features = ["unstable"]

[[bench]]
name = "iterations"
required-features = ["unstable"]

[[bench]]
name = "parsing"
required-features = ["unstable"]

[[bench]]
name = "primes"
required-features = ["unstable"]

# Every other integration test, grain harnesses included, is one binary:
# `tests/it/main.rs`. This one stays its own, and not negotiable: it installs a
# counting global allocator and reads process-global counters as deltas around
# each call, so any test allocating on another thread corrupts every number it
# reports.
[[test]]
name = "grain_allocation_efficiency"
path = "tests/grain/allocation.rs"
required-features = ["grain"]

[profile.dev]
# Line tables keep file:line backtraces; full debug info made each test
# binary hundreds of MB and the target dir tens of GB.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
#opt-level = "z"     # optimize for size
#panic = 'abort'     # remove stack backtrace

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = { version = "1.1.0" } # WASM implementation of std::time::Instant

[package.metadata.docs.rs]
features = ["document-features", "metadata", "serde", "internals", "decimal", "debugging"]
