[package]
name = "rawr-import-cli"
version = "0.3.23"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "rawr-import: runs Rawr programs that use Rust crates from their Cargo.toml"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[dependencies]
rawr = { path = "..", features = ["rust-import", "sync"] }
rawr-cli = { path = "../cli" }
rawr-import = { path = "../importer", features = ["rustc-driver", "embedded-host"] }
rawr-watch = { path = "../watch" }
nix = { version = "0.27.1", features = ["process", "signal"] }

[dev-dependencies]
# A pseudo-terminal for the terminal tests.
nix = { version = "0.27.1", features = ["process", "signal", "term"] }
rawr-import ={ path = "../importer", features = ["rustc-driver", "test-fixtures"] }
rawr-watch = { path = "../watch", features = ["manual"] }
serde_json = "1"

[[bin]]
name = "rawr-import"
path = "src/main.rs"
