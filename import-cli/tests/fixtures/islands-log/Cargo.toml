[package]
name = "islands-log"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
located = { path = "located" }
log = "0.4"
# inboard's version. `located` pins tracing-core, which this package names
# only through tracing, as inboard names it only through its `log` crate.
tracing = "=0.1.44"

# Its own workspace: it is not a member of Rawr's.
[workspace]
members = ["located"]
