[package]
name = "rawr-iced-cli"
version = "0.3.18"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "rawr-iced: iced support for the rawr command"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[features]
default = ["native-runner"]
native-runner = ["dep:rawr-import", "dep:rawr-import-cli", "rawr-import/rustc-driver", "rawr-import/embedded-host", "dep:nix"]

[dependencies]
rawr-cli = { path = "../cli" }
rawr-watch = { path = "../watch" }
rawr = { path = "..", features = ["sync"] }
rawr-import = { path = "../importer", optional = true }
rawr-import-cli = { path = "../import-cli", optional = true }
rawr-iced = { path = "../iced" }
nix = { version = "0.27.1", features = ["process", "signal"], optional = true }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[dev-dependencies]
rawr-watch = { path = "../watch", features = ["manual"] }
rawr-import = { path = "../importer", features = ["rustc-driver", "test-fixtures"] }
rawr-iced = { path = "../iced", features = ["profile-selection-diagnostic"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[[bin]]
name = "rawr-iced"
path = "src/main.rs"
