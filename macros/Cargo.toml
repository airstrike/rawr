[package]
name = "rawr-macros"
version = "0.3.172"
rust-version = "1.95.0"
edition = "2024"
description = "Rawr's attribute for cargo builds: #[rawr::preview] leaves the item as written apart from dead-code warnings"
repository = "https://github.com/airstrike/rawr"
readme = "../README.md"
license = "MIT OR Apache-2.0"
keywords = ["rawr", "iced", "preview"]
categories = ["development-tools"]

# Code names the crate `rawr`: `#[rawr::preview]`.
[lib]
name = "rawr"
path = "src/lib.rs"
proc-macro = true
