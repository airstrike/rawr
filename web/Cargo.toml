[package]
name = "rawr-web"
version = "0.3.22"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "Rawr's snippets running in a browser, on wasm: plain programs as text, iced ones live"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm-only, so a native workspace build compiles an empty crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
# rawr-iced's renderers, and wgpu's WebGL2 backend for browsers without WebGPU.
iced = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b", default-features = false, features = ["advanced", "webgl"] }
# Turns a task into the stream of actions an `async fn main` program's driver polls.
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b" }
js-sys = "0.3.105"
rawr = { path = "..", features = ["sync"] }
# Reads rawr-iced's manifest (its claims and prelude) as `?play` does.
rawr-cli = { path = "../cli" }
rawr-iced = { path = "../iced" }
# How a snippet becomes a program, shared with rawr-play.
rawr-snippet = { path = "../play/snippet" }
# rand, tracing_subscriber and the examples' shipped files, shared with rawr-play.
rawr-play-sandbox = { path = "../play/sandbox" }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.78"
# The deadline of an `async fn main` program, on the page's timer.
wasmtimer = "0.4.3"
web-sys = { version = "0.3.105", features = ["console", "Performance", "Response", "Url", "Window"] }
