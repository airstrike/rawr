[package]
name = "rawr-web"
version = "0.3.173"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "Rawr's snippets running in a browser, on wasm: plain programs as text"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm-only, so a native workspace build compiles an empty crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
# rawr's hash maps seed from getrandom, which takes the page's crypto in a browser.
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3.105"
rawr = { path = "..", features = ["sync"] }
# How a snippet becomes a program, shared with rawr-play.
rawr-snippet = { path = "../play/snippet" }
wasm-bindgen = "0.2.105"
web-sys = { version = "0.3.105", features = ["Performance", "Window"] }
