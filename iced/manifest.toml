# What `rawr-iced --rawr-manifest` prints: the programs `rawr` hands to
# rawr-iced (those naming the `iced` crate) and the commands it adds to
# `rawr`. rawr-iced extends rawr-import: an iced program's Rust dependencies
# are imported the way rawr-import imports them, with iced added to its
# runner, so a program both claim goes to rawr-iced.
# `prelude` is what a snippet host such as `?play` imports into a snippet
# that has no `use` of its own; such a snippet using one of these names is
# rawr-iced's too. `rawr` itself imports nothing.
format = 1
name = "rawr-iced"
crates = ["iced"]
extends = ["rawr-import"]
prelude = [
    "iced::Alignment", "iced::Background", "iced::Border", "iced::Bottom",
    "iced::Center", "iced::Color", "iced::ContentFit", "iced::Degrees",
    "iced::Element", "iced::Fill", "iced::FillPortion", "iced::Font",
    "iced::Function", "iced::Left", "iced::Length", "iced::Padding",
    "iced::Point", "iced::Radians", "iced::Rectangle", "iced::Renderer", "iced::Right",
    "iced::Shadow", "iced::Shrink", "iced::Size", "iced::Subscription",
    "iced::Task", "iced::Theme", "iced::Top", "iced::Vector", "iced::Widget",
    "iced::alignment", "iced::border", "iced::color", "iced::font",
    "iced::gradient", "iced::mouse", "iced::padding", "iced::theme",
    "iced::widget::Button", "iced::widget::Canvas", "iced::widget::Checkbox", "iced::widget::Column",
    "iced::widget::ComboBox", "iced::widget::Container", "iced::widget::Float", "iced::widget::Id",
    "iced::widget::Image", "iced::widget::Logo", "iced::widget::MouseArea",
    "iced::widget::PickList", "iced::widget::Pin", "iced::widget::ProgressBar",
    "iced::widget::QRCode", "iced::widget::Radio", "iced::widget::Responsive", "iced::widget::Row",
    "iced::widget::Scrollable", "iced::widget::Sensor", "iced::widget::Slider",
    "iced::widget::Space", "iced::widget::Stack", "iced::widget::Svg",
    "iced::widget::Table", "iced::widget::Text", "iced::widget::TextEditor", "iced::widget::TextInput",
    "iced::widget::Toggler",
    "iced::widget::Tooltip", "iced::widget::Transition", "iced::widget::bottom",
    "iced::widget::button", "iced::widget::canvas", "iced::widget::center", "iced::widget::center_x",
    "iced::widget::center_y", "iced::widget::checkbox", "iced::widget::column",
    "iced::widget::combo_box", "iced::widget::component", "iced::widget::container",
    "iced::widget::float",
    "iced::widget::hover", "iced::widget::image", "iced::widget::keyed_column", "iced::widget::lazy",
    "iced::widget::left", "iced::widget::mouse_area", "iced::widget::opaque",
    "iced::widget::pick_list", "iced::widget::pin", "iced::widget::progress_bar",
    "iced::widget::qr_code", "iced::widget::radio", "iced::widget::responsive", "iced::widget::rich_text",
    "iced::widget::right", "iced::widget::row", "iced::widget::rule", "iced::widget::scrollable",
    "iced::widget::sensor", "iced::widget::slider", "iced::widget::space", "iced::widget::span",
    "iced::widget::stack", "iced::widget::svg", "iced::widget::table", "iced::widget::text",
    "iced::widget::text_editor", "iced::widget::text_input", "iced::widget::toggler",
    "iced::widget::tooltip",
    "iced::widget::top", "iced::widget::transition", "iced::widget::vertical_slider",
    "iced::widget::void",
]
templates = ["iced"]
commands = ["preview", "snapshot", "doctor", "cache"]

# The tools rawr-iced adds to `rawr mcp`. Core runs each call as
# `rawr-iced mcp call <tool>`. `input` is the arguments' JSON Schema; core
# adds the `path` every tool takes. `screenshot` shares core's name, so it
# is not listed: core's `screenshot` asks it first, because the window's
# own capture needs no Screen Recording permission.
[[tool]]
name = "list_previews"
description = "List the project's #[preview]s as `group/name [subject] size themes`, read from the sources without rendering."
input = '{"type": "object", "properties": {}}'

[[tool]]
name = "render_preview"
description = "Render one #[preview] alone, headlessly, and return the PNG. A first render builds the program's Rust dependencies."
input = '''{"type": "object", "properties": {
    "name": {"type": "string", "description": "The preview's name, group/name, or subject#name"},
    "theme": {"type": "string", "description": "A declared theme, or `native`; defaults to the first declared one"}
}, "required": ["name"]}'''

[[tool]]
name = "click"
description = "Click in the running iced window: the widget showing `text` (exact, else contained, any case; a text input's value or placeholder counts), the widget with `id`, or the logical point `x`,`y` from the top left."
input = '''{"type": "object", "properties": {
    "text": {"type": "string"},
    "id": {"type": "string"},
    "x": {"type": "number"},
    "y": {"type": "number"},
    "screenshot": {"type": "boolean", "description": "Return a screenshot of the window after the input"}
}}'''

[[tool]]
name = "type_text"
description = "Type text into the running iced window's focused widget (click a text input first, or use `do`)."
input = '''{"type": "object", "properties": {
    "text": {"type": "string"},
    "screenshot": {"type": "boolean", "description": "Return a screenshot of the window after the input"}
}, "required": ["text"]}'''

[[tool]]
name = "press_key"
description = "Press and release a key in the running iced window: Enter, Tab, Escape, Backspace, Delete, Space, Left/Right/Up/Down, Home, End, PageUp, PageDown or one character, optionally after cmd+, ctrl+, shift+, alt+."
input = '''{"type": "object", "properties": {
    "key": {"type": "string"},
    "screenshot": {"type": "boolean", "description": "Return a screenshot of the window after the input"}
}, "required": ["key"]}'''

[[tool]]
name = "do"
description = "Run a sequence of inputs in the running iced window, each seeing the state the last left: `actions` of click (text, id, or x and y), type (text) and key (key)."
input = '''{"type": "object", "properties": {
    "actions": {"type": "array", "items": {"type": "object", "properties": {
        "action": {"type": "string", "enum": ["click", "type", "key"]},
        "text": {"type": "string"}, "id": {"type": "string"}, "key": {"type": "string"},
        "x": {"type": "number"}, "y": {"type": "number"}
    }, "required": ["action"]}},
    "screenshot": {"type": "boolean", "description": "Return a screenshot of the window after the inputs"}
}, "required": ["actions"]}'''

[[tool]]
name = "reset"
description = "Boot the running iced window's application or preview afresh, with fresh state."
input = '''{"type": "object", "properties": {
    "screenshot": {"type": "boolean", "description": "Return a screenshot of the window after the reset"}
}}'''

[[tool]]
name = "screenshot"
description = "Capture the running iced window through its own renderer."
input = '{"type": "object", "properties": {}}'
