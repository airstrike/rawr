[package]
name = "rawr-iced"
version = "0.1.0"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "The iced application facade for Rawr"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b", default-features = false, features = ["advanced", "canvas", "crisp", "fira-sans", "image-without-codecs", "qr_code", "selector", "svg", "thread-pool", "tiny-skia", "web-colors", "wgpu"] }
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b" }
# The codecs the `image` widget decodes: PNG and JPEG only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18.1"
rawr = { path = "..", features = ["rust-import", "sync"] }
rawr_import = { package = "rawr-import", path = "../importer" }
rawr-watch = { path = "../watch" }
sha2 = "0.10.9"
thiserror = "2"
# Fallback lists for bundled fonts (src/snapshot/fonts.rs); the version cosmic-text uses.
unicode-script = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b", default-features = false, features = ["x11", "wayland"] }

[dev-dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b", default-features = false, features = ["advanced"] }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b" }
rawr_import = { package = "rawr-import", path = "../importer", features = ["test-fixtures"] }
serde_json = "1"

[features]
grain = ["rawr/grain"]
no_optimize = ["rawr/no_optimize"]
profile-selection-diagnostic = ["rawr_import/canonical-selector-diagnostic"]
# One private profile-fixture pair in the existing baseline artifact.
import-baseline = []

[lib]
name = "rawr_iced"
path = "src/lib.rs"
