[package]
name = "rawr-iced"
version = "0.3.26"
rust-version = "1.95.0"
edition = "2024"
publish = false
description = "The iced application facade for Rawr"
repository = "https://github.com/airstrike/rawr"
license = "MIT OR Apache-2.0"

[dependencies]
# A project's runner builds rawr-iced against the project's own iced, so it
# adds only `advanced` (the profile reads `iced::advanced::Widget`) and
# `sipper` (Rust sippers cross as `task::Sipper`); every other iced feature
# comes from the project, and the features below follow it.
iced = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b", default-features = false, features = ["advanced", "sipper"] }
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b" }
# Reads image headers for the `image` widget; its codecs are the project's.
image = { version = "0.25", default-features = false, optional = true }
png = "0.18.1"
rawr = { path = "..", features = ["sync"] }
sha2 = "0.10.9"
thiserror = "2"
# tokio's timers and channels for Rawr code without a tokio dependency (src/tokio_facade.rs).
# No `fs`, `net`, `process`, `signal` or `io-std`. `test-util` pauses a
# recording's clock.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "test-util", "time"] }
# Fallback lists for bundled fonts (src/snapshot/fonts.rs); the version cosmic-text uses.
unicode-script = "0.5"

# The importer and the watcher read files and run cargo, which a browser
# host has neither of (D518).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rawr = { path = "..", features = ["rust-import", "sync"] }
rawr_import = { package = "rawr-import", path = "../importer" }
rawr-watch = { path = "../watch" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rawr = { path = "..", features = ["sync", "wasm-bindgen"] }
# `time::every`'s ticks, on the page's timer.
wasmtimer = "0.4.3"

[dev-dependencies]
iced_test = { git = "https://github.com/iced-rs/iced", rev = "be88873d38544455e26c7a104eb757da2cbbac6b" }
rawr_import = { package = "rawr-import", path = "../importer", features = ["test-fixtures"] }
serde_json = "1"

[features]
# rawr-iced on its own (the `rawr-iced` command, ?play, tests): every widget
# it supports, with iced's renderers and embedded fonts.
default = ["standalone"]
standalone = [
    "canvas", "image", "qr_code", "selector", "svg",
    "image/png", "image/jpeg",
    "iced/crisp", "iced/fira-sans", "iced/thread-pool", "iced/tiny-skia", "iced/web-colors", "iced/wgpu",
    "iced/x11", "iced/wayland",
]
# One per optional iced widget. A project's runner enables the ones its iced has.
canvas = ["iced/canvas"]
image = ["iced/image-without-codecs", "dep:image"]
qr_code = ["iced/qr_code"]
selector = ["iced/selector"]
svg = ["iced/svg"]
grain = ["rawr/grain"]
profile-selection-diagnostic = ["rawr_import/canonical-selector-diagnostic"]

[lib]
name = "rawr_iced"
path = "src/lib.rs"
